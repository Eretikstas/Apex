name: Learning lab — AutoISF baseline

on:
  push:
    branches:
      - aimi-learning-lab
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: learning-lab-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  autoisf-tests-and-app:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      ANDROID_I_WANT_MY_TCG: "yes"
      GRADLE_OPTS: >-
        -Dorg.gradle.jvmargs="-Xmx6g -XX:+UseParallelGC"
        -Dkotlin.daemon.jvm.options="-Xmx2g"
        -Dkotlin.compiler.execution.strategy=in-process
        -Dorg.gradle.workers.max=2
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: AutoISF host tests
        run: ./gradlew --console=plain :plugins:aps:testAndroidHostTest --tests '*OpenAPSAutoISFPluginTest*' --stacktrace

      - name: Build Full Debug app
        run: ./gradlew --console=plain :app:assembleFullDebug --stacktrace

      - name: Locate Full Debug APK
        id: apk
        shell: bash
        run: |
          echo "APK files under app/build/outputs:"
          find "$GITHUB_WORKSPACE/app/build/outputs" -type f -name '*.apk' -print 2>/dev/null || true
          APK="$(find "$GITHUB_WORKSPACE/app/build/outputs" -type f -name '*.apk' -print -quit 2>/dev/null || true)"
          if [ -z "$APK" ]; then
            echo "::error::assembleFullDebug succeeded but no APK was found under app/build/outputs"
            find "$GITHUB_WORKSPACE/app/build/outputs" -maxdepth 6 -type f -print 2>/dev/null || true
            exit 1
          fi
          echo "apk_path=$APK" >> "$GITHUB_OUTPUT"
          echo "Selected APK: $APK"

      - name: Emulator smoke test
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-boot-timeout: 600
          emulator-options: -no-window -gpu swiftshader -no-snapshot -noaudio -no-boot-anim -accel off -memory 2048 -cores 2
          script: |
            test -f "${{ steps.apk.outputs.apk_path }}"
            adb install -r "${{ steps.apk.outputs.apk_path }}"
            adb shell monkey -p info.nightscout.androidaps 1
            sleep 45
            adb shell dumpsys activity activities | grep -E 'mResumedActivity|topResumedActivity' | tee emulator-activity.txt
            adb shell screencap -p /sdcard/aaps-home.png
            adb pull /sdcard/aaps-home.png aaps-home.png
            adb shell uiautomator dump /sdcard/aaps-window.xml
            adb pull /sdcard/aaps-window.xml aaps-window.xml
            adb logcat -d -t 12000 > emulator-logcat.txt
            if grep -E 'FATAL EXCEPTION|Process: info.nightscout.androidaps' emulator-logcat.txt; then
              exit 1
            fi
            grep -q 'info.nightscout.androidaps' emulator-activity.txt

      - name: Upload emulator evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: learning-lab-emulator-evidence
          path: |
            aaps-home.png
            aaps-window.xml
            emulator-activity.txt
            emulator-logcat.txt
          if-no-files-found: ignore

      - name: Upload AutoISF test reports
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: learning-lab-autoisf-test-reports
          path: plugins/aps/build/reports/tests
          if-no-files-found: ignore

      - name: Upload APK
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: learning-lab-full-debug-apk
          path: app/build/outputs/**/*.apk
          if-no-files-found: ignore
