name: Learning lab — AutoISF baseline

on:
  push:
    branches:
      - aimi-learning-lab
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: learning-lab-${{ github.ref }}
  cancel-in-progress: false

jobs:
  autoisf-tests-and-app:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      GRADLE_OPTS: >-
        -Dorg.gradle.jvmargs="-Xmx6g -XX:+UseParallelGC"
        -Dkotlin.daemon.jvm.options="-Xmx2g"
        -Dkotlin.compiler.execution.strategy=in-process
        -Dorg.gradle.workers.max=2
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: AutoISF host tests
        run: ./gradlew --console=plain :plugins:aps:testAndroidHostTest --tests '*OpenAPSAutoISFPluginTest*' --stacktrace

      - name: Build Full Debug app
        run: ./gradlew --console=plain :app:assembleFullDebug --stacktrace

      - name: Upload AutoISF test reports
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: learning-lab-autoisf-test-reports
          path: plugins/aps/build/reports/tests
          if-no-files-found: ignore

      - name: Upload APK
        if: ${{ success() }}
        uses: actions/upload-artifact@v4
        with:
          name: learning-lab-full-debug-apk
          path: app/build/outputs/apk/full/debug/*.apk
          if-no-files-found: error
