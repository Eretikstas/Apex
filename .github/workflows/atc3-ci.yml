name: ATC3 driver CI

# Builds and tests the ATC3 (Apex TruCare III) pump driver in this AIMI tree.
# Runs on the driver branch and by hand. The APK is a debug build, for testing only.

on:
  workflow_dispatch:
  push:
    branches:
      - atc3-driver

concurrency:
  group: atc3-ci-v2-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      GRADLE_OPTS: >-
        -Dorg.gradle.jvmargs="-Xmx6g -XX:+UseParallelGC"
        -Dkotlin.daemon.jvm.options="-Xmx2g"
        -Dkotlin.compiler.execution.strategy=in-process
        -Dorg.gradle.workers.max=2
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      # The runner was shut down in the middle of the app build: out of disk or memory. Free what this
      # build does not use (the Android SDK stays).
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /usr/share/swift /usr/local/share/boost /opt/hostedtoolcache/CodeQL
          # Swap, so a memory peak of the app build slows it down instead of stopping the runner.
          sudo swapoff -a || true
          sudo rm -f /mnt/swapfile /swapfile
          sudo fallocate -l 8G /swapfile
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile
          free -m
          df -h /

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: temurin

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          # This branch is not the default one: let it write the cache, so the next run is faster.
          cache-read-only: false

      - name: Compile the driver
        run: ./gradlew :pump:atc3:compileFullDebugKotlin --stacktrace

      - name: Compile the driver tests
        run: ./gradlew :pump:atc3:compileFullDebugUnitTestKotlin --stacktrace

      - name: Driver unit tests
        timeout-minutes: 20
        run: ./gradlew :pump:atc3:testFullDebugUnitTest --continue --stacktrace

      - name: End to end scenarios on the virtual pump
        if: ${{ !cancelled() }}
        timeout-minutes: 30
        run: ./gradlew :pump:atc3:testFullDebugUnitTest -Patc3VirtualPump=only --continue --stacktrace

      - name: Core changes unit tests
        if: ${{ !cancelled() }}
        run: >-
          ./gradlew
          :database:impl:testFullDebugUnitTest --tests '*SyncPumpTemporaryBasalTransactionTest*'
          --stacktrace

      - name: Build the app
        id: app
        if: ${{ !cancelled() }}
        run: |
          # The test steps' daemon and its memory are not needed any more: start the build fresh.
          ./gradlew --stop
          # Memory and disk every 30 s in this log, to see what ran out if the runner stops again.
          ( while true; do echo "RESOURCES $(date -u +%T) $(free -m | sed -n 2p) | $(free -m | sed -n 3p) | $(df -h / | tail -1)"; sleep 30; done ) &
          MONITOR=$!
          trap 'kill $MONITOR 2>/dev/null || true' EXIT
          ./gradlew :app:assembleFullDebug --stacktrace
          # Kept apart: the side by side build below writes to the same folder.
          mkdir -p out/regular
          cp app/build/outputs/apk/full/debug/*.apk out/regular/

      # The same app with its own package name (info.nightscout.androidaps.atc3test): it installs next to
      # the AAPS on a phone, not over it, to try the screens. Only the app module is built again.
      - name: Build the side by side test app
        id: sidebyside
        if: ${{ !cancelled() && steps.app.outcome == 'success' }}
        run: |
          # google-services.json knows only info.nightscout.androidaps. The test app gets a copy of that
          # entry under its own name, in this throwaway checkout only (Firebase is not used by it).
          python3 - <<'PY'
          import copy, json
          path = "app/google-services.json"
          data = json.load(open(path))
          names = [c["client_info"]["android_client_info"]["package_name"] for c in data["client"]]
          if "info.nightscout.androidaps.atc3test" not in names:
              entry = copy.deepcopy(next(c for c in data["client"] if c["client_info"]["android_client_info"]["package_name"] == "info.nightscout.androidaps"))
              entry["client_info"]["android_client_info"]["package_name"] = "info.nightscout.androidaps.atc3test"
              entry.pop("oauth_client", None)
              data["client"].append(entry)
              json.dump(data, open(path, "w"), indent=2)
          PY
          ./gradlew :app:assembleFullDebug -Patc3SideBySide=true --stacktrace
          mkdir -p out/sidebyside
          cp app/build/outputs/apk/full/debug/*.apk out/sidebyside/

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: atc3-test-reports
          path: |
            pump/atc3/build/reports/tests/
            database/impl/build/reports/tests/
          retention-days: 14
          if-no-files-found: ignore

      - name: Upload debug APK
        if: ${{ !cancelled() && steps.app.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: aaps-aimi-atc3-fullDebug
          path: out/regular/*.apk
          retention-days: 14
          if-no-files-found: error

      - name: Upload side by side test APK
        if: ${{ !cancelled() && steps.sidebyside.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: aimi-atc3-test-side-by-side
          path: out/sidebyside/*.apk
          retention-days: 14
          if-no-files-found: error

  # The driver in the real app on an emulator: chosen as the pump, its screens open. No pump and no
  # Bluetooth here; delivery is checked against the virtual pump in the unit tests above.
  ui-smoke:
    needs: build
    # Runs even when a unit test failed: the screens are checked on their own.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      GRADLE_OPTS: >-
        -Dorg.gradle.jvmargs="-Xmx6g -XX:+UseParallelGC"
        -Dkotlin.daemon.jvm.options="-Xmx2g"
        -Dkotlin.compiler.execution.strategy=in-process
        -Dorg.gradle.workers.max=2
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      # The runner was shut down in the middle of the app build: out of disk or memory. Free what this
      # build does not use (the Android SDK stays).
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /usr/share/swift /usr/local/share/boost /opt/hostedtoolcache/CodeQL
          # Swap, so a memory peak of the app build slows it down instead of stopping the runner.
          sudo swapoff -a || true
          sudo rm -f /mnt/swapfile /swapfile
          sudo fallocate -l 8G /swapfile
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile
          free -m
          df -h /

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: temurin

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false

      - name: Enable KVM for the emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # Gradle downloads the emulator image itself, but only with every SDK licence accepted first.
      - name: Accept the SDK licences and get the emulator image
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" --install "emulator" "system-images;android-31;google_apis_playstore;x86_64"

      # Old AIMI instrumented tests that replay the JS algorithm were written for the AAPS core before
      # 4.0 and do not compile in this tree (nor in AIMI itself). Nothing else depends on them. They are
      # removed from this job's throwaway checkout only, so the ATC3 smoke test can be built; the
      # repository keeps them, and the APK is not changed by this.
      - name: Leave out the old AIMI tests that do not compile
        run: |
          T=app/src/androidTest/kotlin/app/aaps
          rm -v "$T/ReplayApsResultsTest.kt" "$T/di/AlgModule.kt"
          rm -rv "$T/plugins/aps/openAPS" "$T/plugins/aps/openAPSAMA" "$T/plugins/aps/openAPSSMB" \
            "$T/plugins/aps/openAPSSMBAutoISF" "$T/plugins/aps/openAPSSMBDynamicISF" "$T/plugins/aps/logger"

      - name: ATC3 UI smoke test on an emulator
        run: |
          # Memory and disk every 30 s in this log, to see what ran out if the runner stops again.
          ( while true; do echo "RESOURCES $(date -u +%T) $(free -m | sed -n 2p) | $(free -m | sed -n 3p) | $(df -h / | tail -1)"; sleep 30; done ) &
          MONITOR=$!
          trap 'kill $MONITOR 2>/dev/null || true' EXIT
          ./gradlew :app:emuFullDebugAndroidTest \
            -Pandroid.testInstrumentationRunnerArguments.class=app.aaps.e2e.Atc3UiSmokeTest \
            -Pandroid.testoptions.manageddevices.emulator.gpu=swiftshader_indirect \
            --stacktrace

      - name: Upload UI test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: atc3-ui-test-reports
          path: |
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
          retention-days: 14
          if-no-files-found: ignore
