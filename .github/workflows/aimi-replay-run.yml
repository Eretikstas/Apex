# The only way ChatGPT starts lab runs: commit one batch line to lab/aimi-replay/RUN.txt.
# Checks: every job is the virtual child (SYNTH_), algo is autoisf, at most 120 jobs, no other lab run going,
# no daily start limit (user 25.11). The batch is read from the file into a variable, never put into the script text.
name: AIMI replay from RUN.txt
on:
  push:
    branches: [aimi-replay]
    paths: ['lab/aimi-replay/RUN.txt']
permissions:
  contents: read
  actions: write
concurrency:
  group: aimi-replay-run
  cancel-in-progress: false
jobs:
  start:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check RUN.txt and start the batch
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          BATCH="$(grep -v -e '^[[:space:]]*#' -e '^[[:space:]]*$' lab/aimi-replay/RUN.txt | head -n 1 | tr -d '\r' || true)"
          [ -n "$BATCH" ] || { echo "RUN.txt has no batch line: nothing started"; exit 0; }
          [ "${#BATCH}" -lt 65000 ] || { echo "batch too long"; exit 1; }
          JOBS=$(printf '%s' "$BATCH" | awk -F'|' '{print NF}')
          [ "$JOBS" -le 120 ] || { echo "too many jobs: $JOBS (max 120)"; exit 1; }
          BAD=$(printf '%s' "$BATCH" | tr '|' '\n' | grep -vc 'SYNTH_' || true)
          [ "$BAD" -eq 0 ] || { echo "$BAD job(s) without SYNTH_: refused (real history is never run from here)"; exit 1; }
          BUSY=$(gh api "repos/$REPO/actions/workflows/aimi-replay.yml/runs?per_page=20" \
            --jq '[.workflow_runs[] | select(.event=="workflow_dispatch" and (.status=="queued" or .status=="in_progress"))] | length')
          [ "$BUSY" -eq 0 ] || { echo "another lab run is going: refused, commit again later"; exit 1; }
          gh workflow run aimi-replay.yml --repo "$REPO" --ref aimi-replay \
            -f sim=true -f algo=autoisf -f learn=false -f batch="$BATCH"
          echo "started: $JOBS jobs (algo autoisf, sim true). Results: the public summary of the aimi-replay.yml run."
