name: Sibionics source

# The Sibionics core taken from JugglucoNG (sibionics-core/, not part of the AAPS build): builds it and runs the
# JugglucoNG tests (same numbers on the same real sensor traces).

on:
  workflow_dispatch:
  push:
    branches:
      - autoisf-atc3
    paths:
      - 'sibionics-core/**'
      - 'plugins/sibionics/**'

concurrency:
  group: sibionics-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      GRADLE_OPTS: >-
        -Dorg.gradle.jvmargs="-Xmx6g -XX:+UseParallelGC"
        -Dkotlin.daemon.jvm.options="-Xmx3g"
        -Dkotlin.compiler.execution.strategy=in-process
        -Dorg.gradle.workers.max=2
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Free disk space
        run: sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /usr/share/swift /usr/local/share/boost /opt/hostedtoolcache/CodeQL
      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'
      - name: Native source session and box code tests (plain JVM)
        run: gradle --console=plain -p plugins/sibionics/jvm-check test --continue --stacktrace
      - name: JugglucoNG core tests
        if: ${{ !cancelled() }}
        run: gradle --console=plain -p sibionics-core test --continue --stacktrace
      - name: Upload test reports
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: sibionics-test-reports
          path: |
            sibionics-core/build/reports/tests
            plugins/sibionics/jvm-check/build/reports/tests
          if-no-files-found: ignore
