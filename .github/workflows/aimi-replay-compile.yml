name: AIMI replay compile check

on:
  push:
    branches:
      - aimi-replay
    paths:
      - 'plugins/aps/src/test/kotlin/app/aaps/plugins/aps/openAPSAIMI/**'
      - 'plugins/aps/src/test/kotlin/app/aaps/plugins/aps/openAPSAutoISF/**'
      - 'plugins/aps/src/main/kotlin/app/aaps/plugins/aps/openAPSAIMI/DetermineBasalAIMI2.kt'
      - 'plugins/aps/src/main/kotlin/app/aaps/plugins/aps/openAPSAIMI/orchestration/AimiAdaptationStatusBuilder.kt'
      - 'plugins/main/src/main/kotlin/app/aaps/plugins/main/general/dashboard/viewmodel/AimiAdaptationStatusViewModel.kt'
      - 'plugins/main/src/main/kotlin/app/aaps/plugins/main/general/dashboard/compose/AimiAdaptationStatusScreen.kt'
      - 'implementation/src/test/kotlin/app/aaps/implementation/aps/DetermineBasalResultTest.kt'
      - 'plugins/aps/build.gradle'
      - 'plugins/aps/build.gradle.kts'
      - '.github/workflows/aimi-replay-compile.yml'
      - '.github/workflows/aimi-replay.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compile:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      GRADLE_OPTS: >-
        -Dorg.gradle.jvmargs="-Xmx6g -XX:+UseParallelGC"
        -Dkotlin.daemon.jvm.options="-Xmx2g"
        -Dkotlin.compiler.execution.strategy=in-process
        -Dorg.gradle.workers.max=2
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: temurin

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Compile replay test sources only
        run: ./gradlew :plugins:aps:compileFullDebugUnitTestKotlin --console=plain

      - name: Test AutoISF weight boundaries
        run: ./gradlew :plugins:aps:testFullDebugUnitTest --tests 'app.aaps.plugins.aps.openAPSAutoISF.AutoIsfWeightBoundaryTest' --console=plain

      - name: Run replay audit helper tests without replay inputs
        env:
          AIMI_REPLAY_IN: ''
          AIMI_REPLAY_OUT: ''
        run: ./gradlew :plugins:aps:testFullDebugUnitTest --tests 'app.aaps.plugins.aps.openAPSAIMI.HistoryReplayTest' --console=plain

      - name: Test adaptation status builder and dashboard presenter
        run: |
          ./gradlew :plugins:aps:testFullDebugUnitTest --tests 'app.aaps.plugins.aps.openAPSAIMI.orchestration.AimiAdaptationStatusBuilderTest' --console=plain
          ./gradlew :plugins:main:testFullDebugUnitTest --tests 'app.aaps.plugins.main.general.dashboard.viewmodel.AimiAdaptationStatusViewModelTest' --console=plain

      - name: Test in-memory AIMI status through APSResult wrapper
        run: ./gradlew :implementation:testFullDebugUnitTest --tests 'app.aaps.implementation.aps.DetermineBasalResultTest' --console=plain

      - name: Assemble laboratory FullDebug APK
        run: ./gradlew :app:assembleFullDebug --console=plain

      - name: Upload laboratory APK
        uses: actions/upload-artifact@v4
        with:
          name: aimi-replay-fullDebug-apk
          path: app/build/outputs/apk/full/debug/*.apk
          if-no-files-found: error
          retention-days: 3

  # Writes the public result into lab/aimi-replay/results/ so ChatGPT can read it in the repository (it cannot see
  # GitHub Actions). Only public synthetic lines; a push made with GITHUB_TOKEN starts no other workflow.
  report:
    needs: compile
    if: ${{ always() }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - name: Checkout replay branch
        uses: actions/checkout@v5
        with:
          ref: aimi-replay
          fetch-depth: 20
      - name: Write and push the result file
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          FILE=$(python3 .github/scripts/aimi_lab_report.py compile "$RUN_ID")
          git add lab/aimi-replay/results
          git commit -q -m "Lab result: compile run $RUN_ID" || exit 0
          for i in 1 2 3 4 5; do
            if git pull -q --rebase origin aimi-replay && git push -q origin HEAD:aimi-replay; then echo "written: $FILE"; exit 0; fi
            sleep $((i * 10))
          done
          echo "could not push the result file"; exit 1
