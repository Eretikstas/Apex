name: AIMI replay compile check

on:
  push:
    branches:
      - aimi-replay
    paths:
      - 'plugins/aps/src/test/kotlin/app/aaps/plugins/aps/openAPSAIMI/**'
      - 'plugins/aps/src/main/kotlin/app/aaps/plugins/aps/openAPSAIMI/DetermineBasalAIMI2.kt'
      - 'plugins/aps/src/main/kotlin/app/aaps/plugins/aps/openAPSAIMI/orchestration/AimiAdaptationStatusBuilder.kt'
      - 'plugins/main/src/main/kotlin/app/aaps/plugins/main/general/dashboard/viewmodel/AimiAdaptationStatusViewModel.kt'
      - 'plugins/main/src/main/kotlin/app/aaps/plugins/main/general/dashboard/compose/AimiAdaptationStatusScreen.kt'
      - 'plugins/aps/build.gradle'
      - 'plugins/aps/build.gradle.kts'
      - '.github/workflows/aimi-replay-compile.yml'
      - '.github/workflows/aimi-replay.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compile:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GRADLE_OPTS: >-
        -Dorg.gradle.jvmargs="-Xmx6g -XX:+UseParallelGC"
        -Dkotlin.daemon.jvm.options="-Xmx2g"
        -Dkotlin.compiler.execution.strategy=in-process
        -Dorg.gradle.workers.max=2
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: temurin

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Compile replay test sources only
        run: ./gradlew :plugins:aps:compileFullDebugUnitTestKotlin --console=plain

      - name: Run replay audit helper tests without replay inputs
        env:
          AIMI_REPLAY_IN: ''
          AIMI_REPLAY_OUT: ''
        run: ./gradlew :plugins:aps:testFullDebugUnitTest --tests 'app.aaps.plugins.aps.openAPSAIMI.HistoryReplayTest' --console=plain

      - name: Test adaptation status builder and dashboard presenter
        run: |
          ./gradlew :plugins:aps:testFullDebugUnitTest --tests 'app.aaps.plugins.aps.openAPSAIMI.orchestration.AimiAdaptationStatusBuilderTest' --console=plain
          ./gradlew :plugins:main:testFullDebugUnitTest --tests 'app.aaps.plugins.main.general.dashboard.viewmodel.AimiAdaptationStatusViewModelTest' --console=plain
