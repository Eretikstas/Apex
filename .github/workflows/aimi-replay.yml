name: AIMI history replay

# Runs recorded loop cycles through the AIMI decision engine (HistoryReplayTest) and stores what AIMI
# would have decided. The input (replay/input.enc) and the full result are kept encrypted with
# AIMI_REPLAY_KEY. SYNTH_ jobs additionally publish aggregate-only metrics; no timestamps, raw glucose
# rows, or per-meal carbohydrate amounts are exposed.

on:
  workflow_dispatch:
    inputs:
      learn:
        description: 'Let the AIMI learners learn during the replay'
        type: boolean
        default: true
      prefs:
        description: 'AIMI settings to try, like OApsAIMIMaxSMB=0.3,OApsAIMIPkpdEnabled=true'
        type: string
        default: ''
      pretrained:
        description: 'Two passes: learn on the whole history first, then replay it again with what was learned'
        type: boolean
        default: false
      react_floor:
        description: 'Lowest learned reactivity of AIMI (empty = 0.5, the AIMI value)'
        type: string
        default: ''
      oref_prediction:
        description: 'AIMI prediction with the oref rules (full insulin, deviation gone in 60 min)'
        type: boolean
        default: false
      no_booster:
        description: 'The AIMI dynamic basal booster may not raise the temp basal'
        type: boolean
        default: false
      booster_iob:
        description: 'The AIMI basal booster counts the insulin on board'
        type: boolean
        default: false
      sim:
        description: 'Closed loop on the body model (glucose answers the insulin)'
        type: boolean
        default: false
      algo:
        description: 'Algorithm on the body model: aimi, autoisf, or real (the real doses, a check of the model)'
        type: choice
        options: [aimi, autoisf, real]
        default: aimi
      isf:
        description: 'ISF of the body model in mg/dL per unit (empty = profile ISF)'
        type: string
        default: ''
      batch:
        description: 'Many runs at once: prefs lists separated by | (each one is its own job; prefs above is ignored)'
        type: string
        default: ''
  workflow_call:
    inputs:
      learn:
        type: boolean
        default: true
      prefs:
        type: string
        default: ''
      pretrained:
        type: boolean
        default: false
      react_floor:
        type: string
        default: ''
      oref_prediction:
        type: boolean
        default: false
      no_booster:
        type: boolean
        default: false
      booster_iob:
        type: boolean
        default: false
      sim:
        type: boolean
        default: false
      algo:
        type: string
        default: aimi
      isf:
        type: string
        default: ''
      batch:
        type: string
        default: ''
    secrets:
      AIMI_REPLAY_KEY:
        required: true
  # A push only makes the workflow known to GitHub (so it can be started by hand); it runs nothing.
  push:
    branches:
      - aimi-replay

permissions:
  contents: read

jobs:
  plan:
    if: ${{ github.event_name == 'workflow_dispatch' || inputs.batch != '' || inputs.prefs != '' }}
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.m.outputs.matrix }}
    steps:
      - id: m
        env:
          BATCH: ${{ inputs.batch }}
          ONE: ${{ inputs.prefs }}
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json, os
          b = os.environ.get("BATCH", "").strip()
          items = [x.strip() for x in b.split("|") if x.strip()] if b else [os.environ.get("ONE", "")]
          print("matrix=" + json.dumps({"include": [{"i": i, "prefs": p} for i, p in enumerate(items)]}))
          PY

  replay:
    needs: plan
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix: ${{ fromJson(needs.plan.outputs.matrix) }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      GRADLE_OPTS: >-
        -Dorg.gradle.jvmargs="-Xmx6g -XX:+UseParallelGC"
        -Dkotlin.daemon.jvm.options="-Xmx2g"
        -Dkotlin.compiler.execution.strategy=in-process
        -Dorg.gradle.workers.max=2
    steps:
      - name: Checkout replay branch
        uses: actions/checkout@v5
        with:
          ref: aimi-replay

      - name: Check the key is there
        env:
          AIMI_REPLAY_KEY: ${{ secrets.AIMI_REPLAY_KEY }}
        run: |
          if [ -z "$AIMI_REPLAY_KEY" ]; then
            echo "The repository secret AIMI_REPLAY_KEY is missing."
            exit 1
          fi

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: temurin

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          # Only the default branch (main) writes the Gradle cache by default: this branch never did, so each of the
          # up to 20 parallel jobs downloaded everything again and Maven Central answered 429 (jobs lost).
          cache-read-only: false

      # Robolectric fetches its Android jars while the tests run; kept in a cache for the same reason.
      - name: Cache Robolectric jars
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository/org/robolectric
          key: ${{ runner.os }}-robolectric-${{ hashFiles('gradle/libs.versions.toml') }}
          restore-keys: |
            ${{ runner.os }}-robolectric-

      - name: Replay
        id: replay
        continue-on-error: true
        env:
          AIMI_REPLAY_KEY: ${{ secrets.AIMI_REPLAY_KEY }}
          # Passed as an environment value, never pasted into the script text.
          AIMI_REPLAY_PREFS: ${{ matrix.prefs }}
          AIMI_REPLAY_SIM: ${{ inputs.sim && '1' || '0' }}
          AIMI_REPLAY_ALGO: ${{ inputs.algo }}
          AIMI_REPLAY_SIM_ISF: ${{ inputs.isf }}
          AIMI_REPLAY_REACT_FLOOR: ${{ inputs.react_floor }}
          AIMI_REPLAY_PRED: ${{ inputs.oref_prediction && 'oref' || '' }}
          AIMI_REPLAY_TRACE: '1'
          AIMI_REPLAY_NO_BOOSTER: ${{ inputs.no_booster && '1' || '0' }}
          AIMI_REPLAY_BOOSTER_IOB: ${{ inputs.booster_iob && '1' || '0' }}
          AIMI_REPLAY_PASSES: ${{ inputs.pretrained && '2' || '1' }}
        run: |
          set +e
          W="$RUNNER_TEMP/replay"
          mkdir -p "$W"
          echo "exit_code=1" >> "$GITHUB_OUTPUT"
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 -in replay/input.enc -out "$W/in.json.gz" -pass env:AIMI_REPLAY_KEY || { echo "decryption failed"; exit 1; }
          export AIMI_REPLAY_IN="$W/in.json.gz"
          # SMB_INTERVAL_<minutes> in prefs sets AIMI's base SMB interval (replay branch only).
          AIMI_REPLAY_SMB_INTERVAL="$(printf '%s' "$AIMI_REPLAY_PREFS" | grep -o 'SMB_INTERVAL_[0-9]*' | head -1 | grep -o '[0-9]*$' || true)"
          export AIMI_REPLAY_SMB_INTERVAL
          export AIMI_REPLAY_OUT="$W/out.json.gz"
          export AIMI_REPLAY_HEAP=5g
          export AIMI_REPLAY_LEARN=${{ inputs.learn && '1' || '0' }}
          # Keep the full Gradle log and replay output only in the encrypted archive.
          ./gradlew :plugins:aps:testFullDebugUnitTest --tests '*HistoryReplayTest*' --console=plain > "$W/gradle.log" 2>&1
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          grep -E "BUILD (SUCCESSFUL|FAILED)|AIMI replay: [0-9]+ ticks, [0-9]+ failed|AIMI replay: pass|tests completed" "$W/gradle.log" || true
          # Compile errors name files and lines of the code, never data: show them so they can be fixed.
          grep -E "^e: " "$W/gradle.log" | head -40 || true
          exit $code

      - name: Public synthetic summary
        if: ${{ always() && contains(matrix.prefs, 'SYNTH_') }}
        env:
          AIMI_REPLAY_PREFS: ${{ matrix.prefs }}
        run: |
          python3 - <<'PY'
          import gzip
          import json
          import math
          import os
          import re
          import statistics
          from pathlib import Path

          work = Path(os.environ["RUNNER_TEMP"]) / "replay"
          output = work / "out.json.gz"
          log_path = work / "gradle.log"
          prefs = os.environ.get("AIMI_REPLAY_PREFS", "").strip()
          match = re.search(r"(?:^|[,\s])SYNTH_([0-9]+)(?:[,\s]|$)", prefs)
          if not match:
              raise SystemExit("SYNTH_ day count is missing from prefs")
          total_days = int(match.group(1))
          if total_days < 2:
              raise SystemExit("SYNTH_ summary requires at least two days")
          if not output.is_file():
              raise SystemExit("synthetic replay output is missing")

          with gzip.open(output, "rt", encoding="utf-8") as stream:
              rows = json.load(stream)
          if not isinstance(rows, list) or not rows:
              raise SystemExit("synthetic replay output is empty or invalid")

          # DUMPCSV is an explicit opt-in. The CSV contains only the synthetic virtual-child
          # series and is published separately; real replay inputs/results remain encrypted.
          pref_tokens = [token for token in re.split(r"[,\\s]+", prefs) if token]
          if "DUMPCSV" in pref_tokens:
              log_lines = log_path.read_text(encoding="utf-8", errors="replace").splitlines() if log_path.is_file() else []
              stripped = [line.strip() for line in log_lines]
              try:
                  begin = stripped.index("AIMI_DUMPCSV_BEGIN")
                  end = stripped.index("AIMI_DUMPCSV_END", begin + 1)
              except ValueError:
                  raise SystemExit("DUMPCSV token was set but CSV markers are missing from the replay log")
              csv_lines = stripped[begin + 1:end]
              if len(csv_lines) < 2 or not csv_lines[0].startswith("time_min,"):
                  raise SystemExit("DUMPCSV output is empty or has an invalid header")
              dump_dir = Path("out")
              dump_dir.mkdir(exist_ok=True)
              dump_path = dump_dir / "dump.csv"
              dump_path.write_text("\\n".join(csv_lines) + "\\n", encoding="utf-8")
              print(f"DUMPCSV artifact ready: {dump_path} ({len(csv_lines) - 1} 5-minute rows)")

          timed = [row for row in rows if isinstance(row, dict) and isinstance(row.get("t"), (int, float))]
          if not timed:
              raise SystemExit("synthetic replay output has no tick timestamps")
          start_ms = min(row["t"] for row in timed)
          split_day = total_days // 2
          selected = [
              row for row in timed
              if int((row["t"] - start_ms) // 86_400_000) >= split_day
          ]
          if not selected:
              raise SystemExit("second-half synthetic window is empty")
          day_ids = {int((row["t"] - start_ms) // 86_400_000) for row in selected}
          day_count = len(day_ids)

          glucose = [
              float(row["bg"]) for row in selected
              if isinstance(row.get("bg"), (int, float))
              and math.isfinite(float(row["bg"]))
          ]
          if not glucose:
              raise SystemExit("second-half window has no valid glucose samples")
          below70 = 100.0 * sum(value < 70.0 for value in glucose) / len(glucose)
          below54 = 100.0 * sum(value < 54.0 for value in glucose) / len(glucose)
          above180 = 100.0 * sum(value > 180.0 for value in glucose) / len(glucose)
          mean_bg = statistics.fmean(glucose)
          cv = 100.0 * statistics.pstdev(glucose) / mean_bg if mean_bg else float("nan")

          hypo_grams = sum(
              float(row.get("hypo", 0.0))
              for row in selected
              if isinstance(row.get("hypo", 0.0), (int, float))
              and math.isfinite(float(row.get("hypo", 0.0)))
          )
          # Rows are sampled at a regular cadence, but GAP scenarios may omit ticks.
          # Infer the normal row interval from short positive timestamp deltas.
          timestamps = sorted({row["t"] for row in selected})
          step_deltas = [
              (right - left) / 60_000.0
              for left, right in zip(timestamps, timestamps[1:])
              if 0.0 < (right - left) / 60_000.0 <= 30.0
          ]
          if not step_deltas:
              raise SystemExit("cannot infer synthetic row interval for insulin integration")
          step_minutes = statistics.median(step_deltas)
          if not 1.0 <= step_minutes <= 15.0:
              raise SystemExit(f"unexpected synthetic row interval: {step_minutes:.2f} min")

          insulin_units = 0.0
          for row in selected:
              basal_rate = row.get("deliv", 0.0)
              smb = row.get("units", 0.0)
              manual = row.get("man", 0.0)
              if isinstance(basal_rate, (int, float)) and math.isfinite(float(basal_rate)):
                  insulin_units += float(basal_rate) * step_minutes / 60.0
              if isinstance(smb, (int, float)) and math.isfinite(float(smb)):
                  insulin_units += float(smb)
              if isinstance(manual, (int, float)) and math.isfinite(float(manual)):
                  insulin_units += float(manual)

          pref_tokens = [token for token in re.split(r"[,\s]+", prefs) if token]
          task_name = " ".join(pref_tokens[:3]) or "synthetic"
          table = [
              "| Task | BG <70 (%) | BG <54 (%) | BG >180 (%) | CV (%) | Hypo treatment (g/day) | Daily insulin (U/day) |",
              "|---|---:|---:|---:|---:|---:|---:|",
              f"| {task_name} | {below70:.1f} | {below54:.1f} | {above180:.1f} | {cv:.1f} | {hypo_grams / day_count:.2f} | {insulin_units / day_count:.2f} |",
          ]

          log_lines = log_path.read_text(encoding="utf-8", errors="replace").splitlines() if log_path.is_file() else []
          # Gradle prefixes test-worker standard output with indentation. Strip it
          # before matching, otherwise learner/audit records are silently omitted.
          normalized_log = [(index, line.strip()) for index, line in enumerate(log_lines)]
          learner_all = [
              (index, line) for index, line in normalized_log
              if line.startswith("AIMI replay: learner ALL cards")
          ]
          selected_log = []
          if learner_all:
              selected_log.append(learner_all[-1])
          selected_log.extend(
              (index, line) for index, line in normalized_log
              if line.startswith("AIMI audit ")
          )
          selected_log.sort(key=lambda item: item[0])
          report = table + (["", "Learner / audit:"] + [line for _, line in selected_log] if selected_log else [])
          rendered = "\n".join(report) + "\n"
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as summary:
              summary.write(rendered)
          print(rendered, end="")
          PY

      - name: Encrypt result
        if: ${{ always() }}
        env:
          AIMI_REPLAY_KEY: ${{ secrets.AIMI_REPLAY_KEY }}
        run: |
          set +e
          W="$RUNNER_TEMP/replay"
          tar -C "$W" -czf "$W/result.tgz" gradle.log $( [ -f "$W/out.json.gz" ] && echo out.json.gz )
          mkdir -p out
          openssl enc -aes-256-cbc -pbkdf2 -iter 200000 -salt -in "$W/result.tgz" -out out/result.enc -pass env:AIMI_REPLAY_KEY
          rm -rf "$W"

      - name: Upload the encrypted result
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: aimi-replay-result-${{ matrix.i }}
          path: |
            out/result.enc
            out/dump.csv
          if-no-files-found: ignore
          retention-days: 7
      - name: Preserve replay failure status
        if: ${{ always() }}
        env:
          REPLAY_EXIT_CODE: ${{ steps.replay.outputs.exit_code }}
        run: |
          if [ "$REPLAY_EXIT_CODE" != "0" ]; then
            echo "Replay failed with exit code $REPLAY_EXIT_CODE"
            exit 1
          fi
