name: AIMI replay emulator smoke

# Isolated emulator validation on the laboratory branch. Uses synthetic in-app data only:
# no real pump, CGM, Nightscout credentials, or user profile.
on:
  workflow_dispatch:
  push:
    branches:
      - aimi-replay
    paths:
      - '.github/workflows/aimi-replay-emulator.yml'

concurrency:
  group: aimi-replay-emulator-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  emulator-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    env:
      GRADLE_OPTS: >-
        -Dorg.gradle.jvmargs="-Xmx6g -XX:+UseParallelGC"
        -Dkotlin.daemon.jvm.options="-Xmx2g"
        -Dkotlin.compiler.execution.strategy=in-process
        -Dorg.gradle.workers.max=2
    steps:
      - name: Checkout laboratory branch
        uses: actions/checkout@v5
        with:
          ref: aimi-replay

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /usr/share/swift /usr/local/share/boost /opt/hostedtoolcache/CodeQL
          sudo swapoff -a || true
          sudo rm -f /mnt/swapfile /swapfile
          sudo fallocate -l 8G /swapfile
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile
          free -m
          df -h /

      - name: Prune Russian overlay
        run: python3 tools/ru_overlay_prune.py

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: temurin

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # Match the existing ATC3 emulator workflow: remove obsolete test sources
      # from this ephemeral checkout only; repository files are never modified.
      - name: Exclude obsolete AIMI instrumentation sources from this checkout
        run: |
          T=app/src/androidTest/kotlin/app/aaps
          rm -v "$T/ReplayApsResultsTest.kt" "$T/di/AlgModule.kt"
          rm -rv "$T/plugins/aps/openAPS" "$T/plugins/aps/openAPSAMA" "$T/plugins/aps/openAPSSMB" \
            "$T/plugins/aps/openAPSSMBAutoISF" "$T/plugins/aps/openAPSSMBDynamicISF" "$T/plugins/aps/logger"

      - name: Build app and instrumentation APK
        run: |
          ./gradlew :app:assembleFullDebug :app:assembleFullDebugAndroidTest --stacktrace
          ./gradlew --stop

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Boot Android emulator and run synthetic Ring UI test
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 31
          target: google_apis
          arch: x86_64
          profile: pixel_6
          ram-size: 3072M
          disk-size: 6000M
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -change-locale ru-RU
          disable-animations: true
          script: |
            SCREENS_TEST=app.aaps.e2e.RingSkinScreensTest bash tools/atc3_screens.sh
            grep -Eq 'OK \([1-9][0-9]* tests?\)' out/instrument.txt

      - name: Upload emulator evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aimi-replay-emulator-smoke
          path: |
            out/
            app/build/reports/androidTests/
          retention-days: 14
          if-no-files-found: ignore
