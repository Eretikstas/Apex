name: AutoISF fork + ATC3 driver

# Our ATC3 (Apex TruCare III) pump driver on the blaqone AAPS-autoISF fork (AAPS 4.0 + AutoISF 3.2.1,
# Metro DI). Checks that the driver builds, its tests pass, and (push or by hand) that the app builds.
# Nothing from this branch is meant for a phone yet: bench test first.

on:
  workflow_dispatch:
    inputs:
      app:
        description: 'Also build the app (fullDebug)'
        type: boolean
        default: false
      emulator:
        description: 'Run the app on an emulator: random taps, official end to end tests, screenshots'
        type: boolean
        default: false
  push:
    branches:
      - autoisf-atc3

concurrency:
  group: autoisf-atc3-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  driver:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      GRADLE_OPTS: >-
        -Dorg.gradle.jvmargs="-Xmx6g -XX:+UseParallelGC"
        -Dkotlin.daemon.jvm.options="-Xmx2g"
        -Dkotlin.compiler.execution.strategy=in-process
        -Dorg.gradle.workers.max=2
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /usr/share/swift /usr/local/share/boost /opt/hostedtoolcache/CodeQL
          sudo swapoff -a || true
          sudo rm -f /mnt/swapfile /swapfile
          sudo fallocate -l 8G /swapfile
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile
          df -h /

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Compile the driver
        run: ./gradlew --console=plain :pump:atc3:compileDebugKotlin --stacktrace

      - name: Compile the driver tests
        run: ./gradlew --console=plain :pump:atc3:compileDebugUnitTestKotlin --stacktrace

      - name: Driver unit tests
        run: ./gradlew --console=plain :pump:atc3:testDebugUnitTest --continue --stacktrace

      - name: Core change tests (temporary basal safeguard)
        if: ${{ !cancelled() }}
        run: ./gradlew --console=plain :database:impl:testAndroidHostTest --tests '*SyncPumpTemporaryBasalTransactionTest*' --stacktrace

      - name: Native Sibionics source tests (and the new SourceSensor entry)
        if: ${{ !cancelled() }}
        run: |
          ./gradlew --console=plain :plugins:sibionics:testDebugUnitTest --continue --stacktrace
          ./gradlew --console=plain :plugins:learner:testDebugUnitTest --continue --stacktrace
          ./gradlew --console=plain :database:impl:testAndroidHostTest --tests '*SourceSensor*' --stacktrace

      - name: Ring overview tests (and the preference key list)
        if: ${{ !cancelled() }}
        run: |
          ./gradlew --console=plain :ui:testAndroidHostTest --tests '*Ring*' --tests '*OverviewSizeSweepTest*' :core:interfaces:testAndroidHostTest --tests '*LoopNotesTest*' --continue --stacktrace
          ./gradlew --console=plain :app:testFullDebugUnitTest --tests '*PreferenceKeySnapshotTest*' --tests '*RawPreferenceStoreScanTest*' --continue --stacktrace

      - name: Build the app
        if: ${{ !cancelled() && (github.event_name == 'push' || inputs.app) }}
        run: ./gradlew --console=plain :app:assembleFullDebug --stacktrace
      - name: Bench APK (own package info.nightscout.androidaps.bench, installs next to AAPS)
        if: ${{ !cancelled() && github.event_name == 'workflow_dispatch' && inputs.app }}
        run: |
          # Firebase needs a client entry for the bench package: a copy of the AAPS one, in this run only.
          python3 - <<'PY'
          import json, copy
          p = 'app/google-services.json'
          d = json.load(open(p))
          src = next(c for c in d['client'] if c['client_info']['android_client_info']['package_name'] == 'info.nightscout.androidaps')
          bench = copy.deepcopy(src)
          bench['client_info']['android_client_info']['package_name'] = 'info.nightscout.androidaps.bench'
          d['client'].append(bench)
          json.dump(d, open(p, 'w'), indent=2)
          PY
          # AAPS declares the permission app.aaps.weardata.permission. Android refuses a second app with another key that
          # declares the same name, so the bench build gets its own name (in this run only).
          sed -i 's/app\.aaps\.weardata\.permission/app.aaps.weardata.permission.bench/g' \
            plugins/sync/src/androidMain/AndroidManifest.xml \
            plugins/sync/src/androidMain/kotlin/app/aaps/plugins/sync/wear/receivers/WearDataReceiver.kt
          grep -c 'weardata.permission.bench' plugins/sync/src/androidMain/AndroidManifest.xml
          ./gradlew --console=plain :app:assembleFullDebug -PbenchApk --stacktrace
          mkdir -p bench-apk
          cp app/build/outputs/apk/full/debug/app-full-debug.apk bench-apk/aaps-bench-debug.apk
          # The same as a release build (not debuggable, no LeakCanary, smaller), signed with the runner's debug key.
          ./gradlew --console=plain :app:assembleFullRelease -PbenchApk --stacktrace
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          IN=$(ls app/build/outputs/apk/full/release/*.apk | head -1)
          "$BT/zipalign" -f -p 16 "$IN" aligned.apk
          "$BT/apksigner" sign --ks "$HOME/.android/debug.keystore" --ks-pass pass:android --key-pass pass:android \
            --ks-key-alias androiddebugkey --out bench-apk/aaps-bench-release.apk aligned.apk
          "$BT/apksigner" verify --print-certs bench-apk/aaps-bench-release.apk | head -3
          ls -la bench-apk
      - name: Upload bench APK
        if: ${{ !cancelled() && github.event_name == 'workflow_dispatch' && inputs.app }}
        uses: actions/upload-artifact@v4
        with:
          name: autoisf-atc3-bench-apk
          path: bench-apk/*.apk
          retention-days: 30

      - name: Upload test reports
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: autoisf-atc3-test-reports
          path: |
            pump/atc3/build/reports/tests
            database/impl/build/reports/tests
            plugins/sibionics/build/reports/tests
            plugins/learner/build/reports/tests
            ui/build/reports/tests
            app/build/reports/tests
            app/src/testFull/resources/prefs-schema.txt
          if-no-files-found: ignore
      - name: Upload ring screenshots
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: autoisf-atc3-ring-shots
          path: ui/build/ring-shots
          if-no-files-found: warn

  # How ready is this base? The app on an emulator: first a fresh install tapped at random (crashes
  # and "not responding" are counted), then the official end to end tests of this base, one class at a
  # time so one failure does not hide the others. Screenshots, logcat and a summary are uploaded.
  emulator:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.emulator }}
    runs-on: ubuntu-latest
    timeout-minutes: 260
    env:
      GRADLE_OPTS: >-
        -Dorg.gradle.jvmargs="-Xmx6g -XX:+UseParallelGC"
        -Dkotlin.daemon.jvm.options="-Xmx2g"
        -Dkotlin.compiler.execution.strategy=in-process
        -Dorg.gradle.workers.max=2
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /usr/share/swift /usr/local/share/boost /opt/hostedtoolcache/CodeQL
          sudo swapoff -a || true
          sudo rm -f /mnt/swapfile /swapfile
          sudo fallocate -l 8G /swapfile
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile
          df -h /

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build the app and the test app
        run: |
          set -o pipefail
          ./gradlew --console=plain :app:assembleFullDebug --stacktrace
          # The test app may not compile in this base; the random taps run without it.
          ./gradlew --console=plain :app:assembleFullDebugAndroidTest --stacktrace 2>&1 | tee androidtest-build.log || echo "ANDROID TEST BUILD FAILED" | tee -a androidtest-build.log
          ./gradlew --stop
          find app/build/outputs/apk -name "*.apk" | tee apks.txt

      - name: Enable KVM for the emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run on the emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          ram-size: 4096M
          disk-size: 6G
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          disable-animations: true
          script: bash tools/atc3_emulator_check.sh

      - name: Upload what the emulator showed
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: autoisf-atc3-emulator
          path: |
            emu-out/
            androidtest-build.log
          if-no-files-found: ignore
